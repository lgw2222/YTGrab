name: Build YTGrab APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk YTGrab.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTGrab-apk
          path: YTGrab.apk

      - name: Publish release (phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YTGrab 1.0.${{ github.run_number }}
          body: "Download **YTGrab.apk** below on your phone and tap it to install."
          files: YTGrab.apk
          make_latest: true
